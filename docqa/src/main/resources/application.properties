spring.application.name=docqa
spring.datasource.url=jdbc:postgresql://localhost:5432/docqa
spring.datasource.username=docqa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- AWS S3 ---
# Set this to the bucket name you created in the S3 console (must match exactly).
aws.s3.bucket=docqa-uploads
aws.s3.region=eu-north-1

# --- JWT ---
# Secret used to sign tokens. MUST be >= 32 chars (256 bits) for HS256.
# For real deployments this belongs in an env var / secret manager, NOT committed here.
jwt.secret=dev-only-change-me-please-32bytes-minimum-secret-key
jwt.expiration-ms=3600000

# --- AWS Bedrock (embeddings) ---
aws.bedrock.region=eu-north-1
aws.bedrock.embedding-model=amazon.titan-embed-text-v2:0